[project]
name = "clashpy"
version = "0.1.0"
description = "Automated argumentation reasoning engine combining LLMs with Dung formal semantics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.51.0",
    "pygarg>=1.0.2",
    "python-sat>=1.8.dev16",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
clashpy = "clashpy.cli:main"
clash = "clashpy.cli:main"
generate-docs = "clashpy.doc_generator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clashpy"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
